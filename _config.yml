# FOSEP 웹사이트 기본 설정
title: FOSEP
masthead_title: "공공을 위한 과학기술인포럼 FOSEP"
email: fosep@example.com
description: "FOSEP 공식 웹사이트 - 과학기술의 공공성, 합리성, 민주성"
url: "https://treeshin.github.io"
baseurl: ""  # treeshin.github.io 저장소 특성상 비워두거나 생략해야 합니다.

# 테마 설정 (Minimal Mistakes 사용)
remote_theme: "mmistakes/minimal-mistakes@4.24.0"
minimal_mistakes_skin: "default" # 테마 스킨 색상

plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jekyll-include-cache

# 게시글 레이아웃 설정
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "single"
      author_profile: true
      read_time: true
      share: true
      related: true

category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/